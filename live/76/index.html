<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SiteNeeds</title>
<style>
:root{
  --bg:#F3F4F8; --card:#FFFFFF; --ink:#16192B; --sub:#646A80; --line:#E3E5EC;
  --brand:#1F4FD8; --brand-soft:#E4EBFF; --accent:#FF8A00; --danger:#D93636;
  --wa:#1DA851; --radius:16px;
  --surface:#FFFFFF; --field:#FAFBFD; --ghost:#F1F2F6; --soft2:#EEF0F4; --hl:#F2F6FF;
  --note-bg:#FFF6E8; --note-ink:#8A4B00; --warn-bg:#FFECEC; --warn-ink:#9B1C1C; --ok-bg:#E5F7EC;
  --toast:#16192B; --dark:#16192B; --shadow:var(--shadow);
}
html[data-theme="dark"]{
  --bg:#0D0F14; --card:#171A22; --ink:#ECEEF5; --sub:#9AA1B8; --line:#2A2F3C;
  --brand:#2F5BE6; --brand-soft:#1D2742; --danger:#FF6B6B;
  --surface:#171A22; --field:#10131A; --ghost:#232733; --soft2:#232733; --hl:#1A2238;
  --note-bg:#33260F; --note-ink:#FFC67A; --warn-bg:#3A1515; --warn-ink:#FF9E9E; --ok-bg:#12321F;
  --toast:#2C3242; --dark:#232733; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
html[data-theme="dark"] header{background:#121a33}
html[data-theme="dark"] .tab.on{background:var(--brand);color:#fff}
html[data-theme="dark"] .search{background:#0D0F14;border:1px solid var(--line)}
html[data-theme="dark"] .btn.cp{color:#9DB4FF}
html[data-theme="dark"] .row .plus{color:#9DB4FF}
html[data-theme="dark"] .sheet-bg{background:rgba(0,0,0,.6)}
html[data-theme="dark"] select{background:var(--field)!important;color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif;font-size:16px}
body{padding-bottom:96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:14px 16px 10px}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-size:20px}
.top h1{min-width:0;overflow:hidden}
.top h1 small{display:block;font-size:12px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:19px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;height:44px;background:var(--surface);border-radius:12px;padding:0 6px 0 12px;padding-inline:14px 6px;color:var(--ink)}
.search>span{font-size:16px;opacity:.55;flex:none;line-height:1}
.search input{flex:1;min-width:0;border:0;outline:0;padding:0;height:100%;background:none;font-size:15.5px}
.search input::placeholder{color:#9AA0B4}
.search input::-webkit-search-cancel-button{display:none}
.search .x{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--sub);background:var(--ghost)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.82);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:2px;transition:background .15s,color .15s}
.tab.on{background:#fff;color:var(--brand);font-weight:800;box-shadow:0 2px 6px rgba(10,20,70,.22)}
.badge{display:inline-block;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#FFC24B;color:#3D2A00;font-size:12.5px;font-weight:800;line-height:22px;text-align:center;margin-inline-start:4px;direction:ltr}
main{padding:12px 12px 0}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px var(--shadow)}
.site-head{display:flex;align-items:center;gap:8px}
.site-head b{flex:1}
.site-sum{color:var(--sub);font-size:14px;margin-top:4px}
.field{margin-top:10px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);outline:0}
.field input:focus,.field textarea:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.places{display:flex;flex-wrap:wrap;gap:6px}
.chips.places .chip{flex:1 1 auto;padding:8px 8px;font-size:13.5px;text-align:center;border-radius:10px;white-space:nowrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border-radius:var(--radius);padding:14px 12px;text-align:start;min-height:92px;box-shadow:0 1px 2px var(--shadow);display:flex;flex-direction:column;gap:4px}
.cat .ic{font-size:24px}
.svgic{width:1.45em;height:1.05em;vertical-align:-.15em;display:inline-block}.cat .ic .svgic{width:40px;height:29px;display:block}
.cat b{font-size:15px}
.cat span{font-size:12px;color:var(--sub)}
.back{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-weight:700;color:var(--brand)}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600}
.row .t span{display:block;font-size:13px;color:var(--sub)}
.row .plus{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:22px;display:grid;place-items:center;flex:none}
.row .fav{width:34px;height:34px;display:grid;place-items:center;font-size:21px;color:#B8BCCB;flex:none;border-radius:10px}
.row .fav.on{color:#F5A400}
.row .have{font-size:12px;color:#fff;background:var(--accent);border-radius:8px;padding:2px 7px;flex:none}
.sec{font-size:13px;font-weight:700;color:var(--brand);margin:14px 4px 6px}
.empty{text-align:center;color:var(--sub);padding:36px 16px}
.empty .big{font-size:42px}
.line{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.line[data-li]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.line[data-li] input{-webkit-user-select:text;user-select:text}
.line:last-child{border-bottom:0}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:15px}
.line .t span{display:block;font-size:12.5px;color:var(--sub)}
.line .t i{display:block;font-style:normal;font-size:12.5px;color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{width:34px;height:34px;font-size:20px;color:var(--brand)}
.stepper input{width:46px;text-align:center;border:0;outline:0;font-weight:700;padding:0;background:none;direction:ltr}
.stepper .u{font-size:11px;color:var(--sub);padding-inline-end:6px}
.del{color:var(--danger);font-size:18px;padding:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bar .count{font-size:11.5px;color:var(--sub);text-align:center;min-width:40px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar .count b.badge{margin:0;font-size:14px;min-width:30px;height:26px;line-height:26px;border-radius:13px}
.bar .btn{flex:1 1 0;min-width:0;height:48px;padding:0 4px;gap:5px;font-size:14px;white-space:nowrap;overflow:hidden}
.bar .btn span{overflow:hidden;text-overflow:ellipsis}
.bar .btn.wa{flex-grow:1.2}
.bar .btn svg{width:19px;height:19px;flex:none}
.btn{flex:1;padding:12px 6px;border-radius:12px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.wa{background:var(--wa);color:#fff}
.btn.cp{background:var(--brand-soft);color:var(--brand)}
.btn.pdf{background:#E0533D;color:#fff}
.btn.main{background:var(--brand);color:#fff;width:100%;flex:none;margin-top:14px;padding:14px}
.btn.ghost{background:var(--ghost);color:var(--ink)}
.btn:disabled{opacity:.45}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease,visibility .22s;visibility:hidden;overflow-x:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.pwask{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;font-weight:700}.pwask svg{flex:none}
.ihint{position:fixed;left:0;right:0;bottom:0;z-index:200;padding:12px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.ihc{pointer-events:auto;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:16px;max-width:520px;margin:0 auto;border:2px solid var(--brand)}
.ihc b{font-size:17px;display:block;margin-bottom:8px}.ihc ol{margin:0 0 10px;padding-inline-start:22px;line-height:1.9;font-size:15px}.ihc p{margin:0 0 10px;font-size:15px;line-height:1.6}
.ihc .btn{width:100%;margin-top:6px;display:block;text-align:center;text-decoration:none}
.iharr{pointer-events:none;text-align:center;color:var(--brand);font-size:26px;line-height:1;animation:ihb 1s infinite alternate}@keyframes ihb{to{transform:translateY(6px)}}
.shead{position:sticky;top:-16px;z-index:3;margin:-16px -16px 8px;padding:8px 16px 6px;background:var(--surface);min-height:46px}
.shead .grab{margin:2px auto 0}
.sx,.sbk{position:absolute;top:6px;width:36px;height:36px;border-radius:50%;background:var(--ghost);color:var(--ink);font-size:17px;font-weight:700;display:grid;place-items:center}
.sx{inset-inline-end:12px}.sbk{inset-inline-start:12px;color:var(--brand);font-size:20px}
.sheet h2{margin:0;font-size:19px}
.sheet .it{color:var(--sub);font-size:14px;margin-top:2px}
.sheet h3{font-size:14px;color:var(--sub);margin:16px 0 8px;font-weight:600}
.qty-big{display:flex;align-items:center;gap:10px}
.qty-big button{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-size:28px}
.qty-big input{flex:1;min-width:0;width:0;height:52px;text-align:center;font-size:24px;font-weight:800;border:1px solid var(--line);border-radius:14px;outline:0;direction:ltr}
.qty-big .u{min-width:44px;text-align:center;color:var(--sub)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick .chip{padding:5px 12px}
.kitpart{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.kitpart .t{flex:1;min-width:0;font-size:14px}
.kitpart .t span{display:block;color:var(--sub);font-size:12px}
.note{background:var(--note-bg);color:var(--note-ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--toast);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.mini{font-size:12.5px;color:var(--sub)}
.danger-link{color:var(--danger);font-weight:600;font-size:14px;padding:8px}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.iconbtn.lang{font-size:14px;font-weight:800;width:auto;padding:0 10px}
.iconbtn.calcbtn{font-size:13.5px;font-weight:700;gap:4px;display:flex;align-items:center;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto;text-align:center;border-radius:12px}
.contact{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;width:100%;text-align:start}
.contact .ci{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.contact b{display:block;font-size:15px}.contact span{font-size:12.5px;color:var(--sub)}
.pros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.pro{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;text-align:center;min-width:0}
.pro b{font-size:14.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pro span{font-size:12px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtag,.line .t .gtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--wa);border-radius:6px;padding:1px 6px;vertical-align:2px;margin-inline-start:4px}
.line.got{opacity:.62}
.arrbtn{width:100%;margin-top:12px;padding:14px;border:2px dashed var(--line)}
.arrlist{margin-top:6px}.arr{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.arr:last-child{border-bottom:0}
.arr input{width:24px;height:24px;flex:none;accent-color:var(--wa)}.arr span{min-width:0}.arr b{display:block;font-size:15px}.arr small{display:block;color:var(--sub);font-size:12.5px}
.tplrow{gap:8px}
.logorow{display:flex;align-items:center;gap:10px}.logorow img{height:44px;max-width:120px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:contain}.logorow .btn{flex:1}
.mlist{background:var(--bg);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;text-align:start;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
.mrow .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.mrow div{flex:1;min-width:0}.mrow b{display:block;font-size:15px}.mrow span{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow i{font-style:normal;color:var(--sub);font-size:22px;flex:none}html[dir=rtl] .mrow i{transform:scaleX(-1)}
.sback{color:var(--brand);font-weight:700;font-size:14.5px;padding:2px 0 8px}
.scard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.scard h3{margin:0 0 10px;font-size:15.5px;color:var(--ink);font-weight:800}.scard h4{margin:14px 0 6px;font-size:13.5px;color:var(--sub);font-weight:600}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}.srow:last-of-type{border-bottom:0}
.srow span{width:24px;text-align:center;flex:none}.srow b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow i{color:var(--sub);font-weight:400}
.srow img{height:28px;max-width:70px;border-radius:6px;background:#fff;object-fit:contain;border:1px solid var(--line)}
.ssave{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:14px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.prosbtn{margin-top:12px;background:var(--card)}
.clrow{display:flex;gap:6px;align-items:stretch;margin-top:8px}.clrow .contact{margin-top:0;flex:1;min-width:0}
.cldup{flex:none;width:46px;border:1px solid var(--line);border-radius:12px;font-size:19px;color:var(--brand);background:var(--brand-soft)}
.iconbtn.lang{font-size:14px;font-weight:800;width:auto;padding:0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto;text-align:center;border-radius:12px}
.contact{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;width:100%;text-align:start}
.contact .ci{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.contact b{display:block;font-size:15px}.contact span{font-size:12.5px;color:var(--sub)}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft2)}
.thumb.big{width:96px;height:96px;border-radius:14px}
.thumb.pimg{width:52px;height:52px;object-fit:contain;background:#fff;padding:2px}.thumb.pimg.big{width:170px;height:170px;padding:6px;border-radius:16px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-inline-end:5px;flex:none}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .cn{flex:1;font-size:15px;display:flex;align-items:center}
.crow .dot{width:22px;height:22px}
.crow.on .cn{font-weight:700}
.tools{display:flex;gap:4px;flex:none}
.tools button{width:34px;height:34px;border-radius:9px;background:var(--ghost);font-size:15px}
.tools button.on{background:#FFE3E3}
.row.hid{opacity:.45}
.proj{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.proj .t{flex:1;min-width:0;text-align:start}
.proj .t b{display:block;font-size:15px}
.proj .t span{display:block;font-size:12.5px;color:var(--sub)}
.proj.cur{background:var(--hl)}
.proj .t .tag{display:inline-block;color:#fff;font-size:11px}
.top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{font-size:11px;background:var(--brand);color:#fff;border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:1px}
.adm-head{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.adm-head b{flex:1}
.adm-head button{color:#fff;background:rgba(255,255,255,.14);border-radius:9px;padding:6px 10px;font-size:13px}
.menu{display:grid;gap:10px}
.menu button{background:var(--card);border-radius:14px;padding:14px;text-align:start;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px var(--shadow)}
.menu button .ic{font-size:24px}
.menu button b{display:block}.menu button span{font-size:12.5px;color:var(--sub)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:10px}

.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}

.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}

.cres .trow b{text-align:end}
.iconbtn{width:38px;height:38px}
.top{gap:6px}
.combo{position:relative}
.combo input{padding-inline-end:52px!important}
.combo-btn{position:absolute;inset-inline-end:4px;top:4px;bottom:4px;width:44px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:20px;font-weight:800}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}

/* ===== Design v2 (stile app moderna: chiaro, morbido, icone 3D) ===== */
:root{--bg:#F4F6FB;--radius:20px;--shadow:rgba(30,45,90,.08);--brand:#1F5BFF;--brand-soft:#E8EEFF}
html[data-theme="dark"]{--bg:#0B0E15;--brand:#3B6BFF}
header{background:var(--bg);color:var(--ink);padding:14px 16px 8px;box-shadow:none}
html[data-theme="dark"] header{background:var(--bg)}
.top{gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(135deg,#2B6BFF,#0E2A7A);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 12px rgba(31,91,255,.25)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar img.lg{object-fit:contain;padding:4px;background:#0E1A40}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:13px;color:var(--sub)}
.top h1#ttl{font-size:19px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1#ttl small{display:none}
.iconbtn{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px var(--shadow);width:44px;height:44px;border-radius:14px;font-size:18px}
.iconbtn.lang{width:auto;padding:0 10px;font-size:13px;font-weight:700}
.search{height:50px;border-radius:16px;background:var(--surface);box-shadow:0 2px 10px var(--shadow);margin-top:12px}
html[data-theme="dark"] .search{background:var(--surface);border:1px solid var(--line)}
/* barra di navigazione flottante */
.nav{position:fixed;z-index:40;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0 auto;max-width:560px;background:var(--surface);border-radius:24px;box-shadow:0 10px 30px rgba(20,30,70,.18);padding:6px;display:flex;gap:2px}
.nav .tab{flex:1;background:none;color:var(--sub);flex-direction:column;gap:2px;padding:6px 2px 5px;border-radius:18px;font-size:11px;font-weight:600;position:relative;box-shadow:none}
.nav .tab .ni{font-style:normal;font-size:20px;line-height:1;display:grid;place-items:center;height:28px}
.nav .tab .ni img{width:28px;height:28px}
.nav .tab.on{background:var(--brand-soft);color:var(--brand);font-weight:800;box-shadow:none}
html[data-theme="dark"] .nav .tab.on{background:var(--brand-soft);color:#9DB4FF}
.nav .tab .badge{position:absolute;top:2px;inset-inline-end:12%;margin:0;min-width:19px;height:19px;line-height:19px;font-size:11px;padding:0 5px}
.nav .tab span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
body{padding-bottom:170px}
.bar{bottom:calc(84px + env(safe-area-inset-bottom));left:12px;right:12px;margin:0 auto;max-width:560px;border-radius:20px;border:0;box-shadow:0 8px 24px rgba(20,30,70,.14);padding:8px}
/* card e griglia */
.card,.list,.cat{border-radius:var(--radius);box-shadow:0 2px 12px var(--shadow)}
.grid{grid-template-columns:repeat(3,1fr);gap:10px}
.cat{align-items:center;text-align:center;padding:14px 6px 12px;min-height:118px;gap:6px}
.cat .ic{width:58px;height:58px;border-radius:18px;background:var(--hl);display:grid;place-items:center;font-size:30px}
.cat .ic img.i3{width:42px;height:42px}
.cat .ic .svgic{width:40px;height:29px}
.cat b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat span{font-size:11px}
img.i3{width:1.4em;height:1.4em;vertical-align:middle;object-fit:contain}
.h2{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.h2 b{font-size:17px;font-weight:800}
.h2 button{color:var(--brand);font-size:13px;font-weight:700}
/* banner */
.banner{position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 16px 16px;background:linear-gradient(120deg,#1F5BFF 0%,#3E86FF 55%,#7FB2FF 100%);color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 24px rgba(31,91,255,.28);margin-bottom:4px}
.banner small{font-size:12px;opacity:.9;font-weight:600}
.banner b{display:block;font-size:18px;line-height:1.3;margin:4px 0 10px;max-width:64%}
.banner .bbtn{align-self:flex-start;background:#FF8A00;color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13.5px;box-shadow:0 4px 12px rgba(255,138,0,.35)}
.banner .bimg{position:absolute;bottom:-6px;inset-inline-end:6px;width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
/* progetto compatto */
.qrow{display:flex;gap:8px;margin-bottom:10px}
.qrow button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:14px;background:var(--surface);box-shadow:0 2px 10px var(--shadow);font-weight:700;font-size:13.5px}
.qrow button.pri{background:var(--brand);color:#fff}
.qrow img.i3{width:22px;height:22px}
/* professionisti */
.pcar{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pcar::-webkit-scrollbar{display:none}
.pcard{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:12px;text-align:center}
.pcard .pp{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;object-fit:cover;background:var(--hl);display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:22px}
.pcard b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard span{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* righe pezzi */
.list{background:none;box-shadow:none;overflow:visible}
.list>.row{background:var(--card);border-radius:18px;margin-bottom:8px;border:0;box-shadow:0 2px 10px var(--shadow);padding:10px 12px}
.thumb.pimg{width:58px;height:58px;border-radius:14px}
.row .plus{border-radius:12px;background:var(--brand);color:#fff}
.addown{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:2px dashed var(--brand);color:var(--brand);border-radius:18px;padding:12px 14px;font-weight:800;margin:0 0 10px}
.addown img.i3{width:30px;height:30px}
.sec{font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.pcard>img:first-child,.pcard>span:first-child{margin:0 auto 6px;width:64px!important;height:64px!important;border-radius:50%!important}
.mlcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:20px;box-shadow:0 2px 12px var(--shadow);padding:12px 14px;margin-top:12px;text-align:start;border:2px solid var(--brand-soft)}
.mlcard img.i3{width:44px;height:44px;flex:none}.mlcard span{flex:1;min-width:0}.mlcard b{display:block;font-size:15.5px}.mlcard small{color:var(--sub);font-size:12.5px}.mlcard i{font-style:normal;color:var(--brand);font-size:22px;font-weight:800}
.mlrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.mlrow input,.mlrow select{border:1px solid var(--line);border-radius:10px;padding:10px 8px;background:var(--field);font:inherit;color:inherit;min-width:0}
.mln{flex:1}.mln,.mltxt textarea{unicode-bidi:plaintext}.mlq{width:62px;text-align:center;direction:ltr}.mlu{width:84px}
.mldel{width:34px;height:40px;color:var(--danger);font-size:16px;flex:none}
.mltxt{margin-top:12px}.mltxt summary{color:var(--brand);font-weight:700;cursor:pointer;padding:6px 0}
.mltxt textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field);margin-top:6px}
.paper{background:#fff;color:#16192B;border-radius:14px;box-shadow:0 6px 24px rgba(20,30,70,.16);padding:18px 16px 14px}
.paper .ph{display:flex;align-items:center;gap:12px}.paper .pl img{width:58px;height:58px;object-fit:contain;border-radius:8px}
.paper .pt small{display:block;color:#4A5470;font-size:13px}.paper .pt b{display:block;font-size:22px;font-weight:800;color:#14213D}
.paper .pr{height:3px;background:linear-gradient(90deg,#0E2A5C,#1F5BFF 55%,#F5B700);border-radius:2px;margin:12px 0}
.paper .pm{font-size:13.5px;color:#4A5470;line-height:1.8}.paper .pm b{color:#14213D}
.paper .pth,.paper .prw{display:grid;grid-template-columns:24px 1fr 62px 70px;gap:6px;align-items:center}
.paper .pth{font-size:11.5px;font-weight:800;color:#4A5470;text-transform:uppercase;border-bottom:2px solid #D9E1F0;padding:12px 0 6px;letter-spacing:.3px}
.paper .prw{border-bottom:1px solid #E6EBF4;min-height:46px}
.paper .pn{color:#8A93AA;font-size:13px}
.paper input,.paper select{border:0;background:transparent;font:inherit;color:#14213D;outline:0;min-width:0;padding:8px 2px}
.paper .pin{font-size:15px}.paper .pin::placeholder{color:#B3BACB}
.paper .pq{text-align:center;font-weight:800;direction:ltr}.paper .pq::placeholder{color:#B3BACB}
.paper .pu{color:#4A5470;font-size:13.5px}
.paper input:focus{background:#F2F6FF;border-radius:6px}
.pbt{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.pbt button{border:1px solid #D9E1F0;border-radius:14px;padding:9px 14px;font-weight:700;color:#14213D;background:#fff}
.psend{background:linear-gradient(135deg,#F5B700,#E89A00)!important;color:#1A1300!important;font-size:16px;margin-top:14px}
.sendopts{display:grid;gap:10px;margin-top:6px}.sendopts .btn{padding:15px;font-size:16px}
html .paper select,html[data-theme] .paper select{background:transparent!important;color:#4A5470!important;border:0!important}html .paper input,html[data-theme] .paper input{background:transparent!important;color:#14213D!important}html .paper input:focus{background:#F2F6FF!important}
.when{margin:0 0 12px}.when>span{display:block;font-weight:800;font-size:14px;margin:0 4px 6px}.when .chips{gap:6px}
.paper .when{margin:14px 0 0}.paper .when>span{color:#14213D}.paper .when .chip{background:#fff;color:#14213D;border-color:#D9E1F0}.paper .when .chip.on{background:#0E2A5C;color:#fff;border-color:#0E2A5C}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}.tgl input{width:22px;height:22px;flex:none}
.tgbox{background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:12px 12px 10px}.tgbox>b{display:block;font-size:15px;margin-bottom:4px}
.tgrow{margin-top:8px}.tgrow>span{display:block;font-size:12px;color:var(--sub);margin:0 2px 4px}.tgrow .chips{gap:6px}.tgrow .chip{padding:6px 11px;font-size:13px}
.tgres{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px}.tgres button{color:var(--danger);font-weight:700;font-size:13px}
.tcard{background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:12px 14px;margin-bottom:10px}
.th1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tb{font-weight:900;color:var(--brand);font-size:14px}.tr{font-weight:800;background:var(--ghost);border-radius:8px;padding:2px 8px;font-size:13px}.tc{margin-inline-start:auto;font-size:11.5px;color:var(--sub);background:var(--hl);border-radius:8px;padding:2px 8px}
.tn{font-weight:700;font-size:14.5px;margin-top:6px;line-height:1.35}
.tbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tbadges span{font-size:12.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:3px 8px}
.tact{display:flex;gap:8px;margin-top:10px}.tact .btn{margin:0;padding:10px 6px;font-size:13.5px;flex:1;width:auto}
.tgc{border-color:#FFE7B0}.tpn{display:block;width:100%;margin-top:8px;padding:8px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13.5px}.pnc{border-color:#C9DBFF}
.pnact{margin:4px 0 10px}
.pnwrap{background:#fff;border-radius:18px;box-shadow:0 2px 12px var(--shadow);overflow:auto;-webkit-overflow-scrolling:touch;padding:6px}
.pnin.z{width:210%}
.pngo{display:flex;gap:8px}.pngo .btn{flex:1;margin:0;width:auto}
.pnlist{background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);overflow:hidden}
.pnrow{display:grid;grid-template-columns:42px 1fr;gap:2px 8px;width:100%;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);background:none;color:var(--ink)}
.pnrow:last-child{border-bottom:0}.pnrow b{grid-row:span 2;color:var(--brand);font-size:15px;align-self:center}.pnrow span{font-weight:700;font-size:14.5px}.pnrow i{font-style:normal;font-size:12.5px;color:var(--sub);text-align:start}
.pnempty{background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:22px 18px;text-align:center}.pnempty .big{font-size:46px}.pnempty p{color:var(--sub);line-height:1.5;margin:8px 0 14px}
.pnct{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}.pnct small{color:var(--sub);font-size:11.5px;display:block}
.pnq{display:flex;align-items:center;gap:10px}.pnq button{width:34px;height:34px;border-radius:10px;background:var(--ghost);font-size:20px;font-weight:800;color:var(--ink)}.pnq b{min-width:18px;text-align:center}
.pnadd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pnadd .btn{margin:0;width:auto}
#sheet .inp{width:100%}
body.studio header,body.studio #tabs,body.studio #bar{display:none!important}body.studio{padding-bottom:30px!important}body.studio main{padding-top:0}
.stu{margin:0 -2px}
.stbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;background:var(--bg);padding:10px 2px 8px}
.stb{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:0 1px 6px var(--shadow);font-size:20px;font-weight:800;color:var(--ink);flex:0 0 42px}.stb:disabled{opacity:.35}
.stt{flex:1;min-width:0}.stt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stt small{color:var(--sub);font-size:11.5px}
.stmods{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.stmods::-webkit-scrollbar{display:none}
.stmods button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;border-radius:14px;background:var(--card);box-shadow:0 1px 6px var(--shadow);font-size:11.5px;font-weight:700;color:var(--sub);min-width:66px}
.stmods button i{font-style:normal;font-size:19px}.stmods button.on{background:var(--brand);color:#fff}
.sttools{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}.sttools::-webkit-scrollbar{display:none}
.sttools button{flex:0 0 auto;padding:8px 11px;border-radius:12px;background:var(--card);box-shadow:0 1px 5px var(--shadow);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}.sttools button:disabled{opacity:.4}.sttools button.on{background:var(--brand-soft);color:var(--brand)}
.sttools.sub button{font-size:12.5px;padding:7px 10px}
.stc{position:relative;height:58vh;min-height:320px;overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 2px 12px var(--shadow);touch-action:none;cursor:grab}
.stz{transform-origin:0 0;will-change:transform;direction:ltr}.stc{direction:ltr}
.stzoom{position:absolute;bottom:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px}.stzoom button{width:40px;height:40px;border-radius:12px;background:rgba(20,33,61,.85);color:#fff;font-size:18px;font-weight:800}
.ststat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--sub);padding:8px 6px 0}.ststat b{color:var(--ink)}
.stsrch input{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);color:var(--ink);font-size:15px;outline:0}
.stcard{background:var(--card);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:12px 14px;margin-bottom:10px}.stcard.cur{outline:2px solid var(--brand)}
.sth{display:flex;align-items:center;justify-content:space-between;gap:8px}.sth b{font-size:15px}.sth i{font-style:normal;font-size:12.5px;color:var(--sub)}
.stst{color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.stmode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stmode button{text-align:start;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:0 1px 6px var(--shadow);color:var(--ink)}.stmode button.on{outline:2px solid var(--brand)}.stmode small{display:block;color:var(--sub);font-size:11.5px;margin-top:3px;font-weight:400}

.sttbl{overflow-x:auto;background:var(--card);border-radius:14px;box-shadow:0 1px 6px var(--shadow)}.sttbl table{border-collapse:collapse;width:100%;font-size:12px}.sttbl th,.sttbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}.sttbl th{background:var(--hl);font-size:11.5px}

.stv{margin-top:8px;direction:inherit}
.stres{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px}

/* splash */
.splash{position:fixed;inset:0;z-index:300;background:radial-gradient(120% 80% at 50% 20%,#1B3A8C 0%,#0B1530 55%,#060B1A 100%);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .45s ease}
.splash.off{opacity:0}
.splash.gone{display:none}
.spl-in{text-align:center;color:#fff;animation:splIn .6s ease-out}
.spl-logo{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
.spl-name{font-size:38px;font-weight:900;letter-spacing:-.5px;margin-top:6px;direction:ltr}
.spl-name span{color:#3E8BFF}
.spl-tag{font-size:15px;opacity:.85;margin-top:4px}
.spl-trades{display:flex;gap:18px;justify-content:center;margin-top:22px}
.spl-trades span{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.spl-trades .t1{background:#FFC21A}.spl-trades .t2{background:#1F6BFF}.spl-trades .t3{background:#1DA851}
@keyframes splIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* onboarding */
.wz{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));transition:opacity .3s}
.wz.out{opacity:0}
.wzin{max-width:520px;margin:0 auto;position:relative}
.wz h2{font-size:24px;font-weight:900;text-align:center;margin:18px 0 4px}
.wzs{text-align:center;margin-bottom:16px}
.wzdots{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.wzdots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:.2s}
.wzdots i.on{width:26px;background:var(--brand)}.wzdots i.ok{background:#9DB4FF}
.wzback{position:absolute;top:-4px;inset-inline-start:0;width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:0 2px 8px var(--shadow);font-size:18px;color:var(--brand);font-weight:800}
.wzlogo{text-align:center;margin-top:6px}
.wzlogo img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(20,40,120,.25))}
.wzname{font-size:30px;font-weight:900;direction:ltr;letter-spacing:-.4px}.wzname span{color:var(--brand);font-size:.7em}
.wzopt{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px var(--shadow);text-align:start}
.wzopt b{flex:1;font-size:16.5px}
.wzopt.on{border-color:var(--brand);background:var(--hl)}
.wzopt .wzf{font-size:28px;line-height:1}
.wzopt .wzr{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.wzopt.on .wzr{border:6px solid var(--brand)}
.wzopt.big{padding:16px}
.wzopt .wzi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--hl);flex:none}
.wzopt .wzi img.i3{width:38px;height:38px}
.wzopt .wzt{flex:1;min-width:0}.wzopt .wzt b{display:block}.wzopt .wzt small{color:var(--sub);font-size:13px}
.wzopt.dis{opacity:.6}
.soon{font-style:normal;font-size:11px;background:#FFE7C2;color:#8A4B00;border-radius:8px;padding:2px 7px;margin-inline-start:6px;vertical-align:2px}
.wzsel{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--field);font:inherit;color:inherit}
.wzprep{text-align:center;padding-top:22vh}
.wzprep img{width:130px;height:130px;object-fit:contain}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);margin:22px auto 12px;animation:spn .8s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
</style>
</head>
